# AI-assisted configuration; review evidence before submission.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check collaboration and acceptance files
        shell: bash
        run: |
          set -euo pipefail
          for file in README.md Changes.md .agent/acceptance.md \
            docs/architecture.md docs/collaboration.md docs/contributions.md \
            docs/ai-assistance.md \
            .env.example .github/PULL_REQUEST_TEMPLATE.md \
            .github/ISSUE_TEMPLATE/task.yml; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
          for dir in contracts scripts src test; do
            test -d "$dir" || { echo "Missing directory: $dir"; exit 1; }
          done

  implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: Compile contracts
        run: npm run compile
      - name: Test contracts
        run: npm run test:contracts
      - name: Test independent-chain protocol and recovery
        run: npm run test:protocol
      - name: Build web interface
        run: npm run build:web
      - name: Check submission evidence
        run: npm run check:acceptance

  final-acceptance:
    if: github.event_name == 'workflow_dispatch'
    needs: [workspace, implementation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check submission files
        shell: bash
        run: |
          set -euo pipefail
          test -s contracts/ERC20HTLC.sol
          test -s contracts/ETHHTLC.sol
          test -n "$(find scripts -type f ! -name '.gitkeep' -print -quit)"
          test -n "$(find src -type f ! -name '.gitkeep' -print -quit)"
          test -s .env.example
          test -s Report.pdf
          test -s docs/contributions.md
          test -s Changes.md
          if [[ ! -s presentation.pdf && ! -s presentation.pptx ]]; then
            echo "Missing presentation.pdf or presentation.pptx"
            exit 1
          fi
          if grep -q '\bTBD\b' docs/contributions.md; then
            echo "Fill real name and student ID before final submission"
            exit 1
          fi
          echo "Files are present. Review on-chain and live-demo evidence manually." \
            >> "$GITHUB_STEP_SUMMARY"
